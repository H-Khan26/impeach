[package]
name = "ce-models"
description = "Model traits (embedder, NLI, LLM, NER, coreference), registry and backends"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["fastembed", "ort-nli", "ollama"]
# Sentence embeddings through fastembed (ONNX Runtime).
fastembed = ["dep:fastembed"]
# DeBERTa NLI cross-encoder through ONNX Runtime, model files from the Hugging Face hub.
ort-nli = ["dep:ort", "dep:tokenizers", "dep:hf-hub"]
# Ollama HTTP LLM backend.
ollama = ["dep:ollama-rs", "dep:tokio"]
# GLiNER2 NER and relation extraction (candle).
gliner2 = ["dep:gliner2"]

[dependencies]
ce-config.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
process-wrap.workspace = true
fastembed = { workspace = true, optional = true }
ort = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
hf-hub = { workspace = true, optional = true }
ollama-rs = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
gliner2 = { workspace = true, optional = true }

[dev-dependencies]
pretty_assertions.workspace = true
tempfile.workspace = true

[lints]
workspace = true
