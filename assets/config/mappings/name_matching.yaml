# Name Matching Configuration for Entity Disambiguation
# Defines rules for matching PERSON and ORG names with variations.
#
# Used by:
# - services/ed/name_similarity.py (type-aware name matching)
# - services/ed/service.py (enhanced similarity scoring)

# Titles to strip from PERSON names before comparison
# These don't affect person identity
person_titles:
  # Honorifics
  - mr
  - mrs
  - ms
  - miss
  - mx
  
  # Professional titles
  - dr
  - doctor
  - prof
  - professor
  
  # Legal titles
  - judge
  - justice
  - hon
  - honorable
  - attorney
  - atty
  - esq
  - esquire
  - counselor
  - counsel
  
  # Military/Law Enforcement
  - officer
  - detective
  - sergeant
  - sgt
  - lieutenant
  - lt
  - captain
  - capt
  - chief
  - deputy
  - agent
  
  # Medical
  - nurse
  - rn
  - md
  - do
  - phd

