  - a
  - an

# Acronym expansions for common legal/government entities
# Used to match "FBI" with "Federal Bureau of Investigation"
org_acronyms:
  fbi: federal bureau of investigation
  cia: central intelligence agency
  dea: drug enforcement administration
  atf: bureau of alcohol tobacco firearms and explosives
  ice: immigration and customs enforcement
  dhs: department of homeland security
  doj: department of justice
  sec: securities and exchange commission
  ftc: federal trade commission
  irs: internal revenue service
  epa: environmental protection agency
  osha: occupational safety and health administration
  eeoc: equal employment opportunity commission
  nlrb: national labor relations board
  fcc: federal communications commission
  fda: food and drug administration
  hud: housing and urban development
  usps: united states postal service
  va: veterans affairs
  sba: small business administration
  dot: department of transportation
  dmv: department of motor vehicles
  nypd: new york police department
  lapd: los angeles police department

# Similarity thresholds for matching decisions
thresholds:
  # Exact match after normalization (name parts match perfectly)
  exact_match: 0.98
  
  # One name is subset of other (e.g., "Smith" vs "John Smith")
  subset_match_base: 0.80
  subset_match_bonus: 0.15
  
  # Partial overlap in name parts
  partial_overlap_base: 0.60
  partial_overlap_bonus: 0.30
  
  # Minimum length for fuzzy matching (avoid "Al" matching everything)
  min_fuzzy_match_length: 4
  
  # Minimum word length to consider in name parts
  min_word_length: 2

# Configuration flags
settings:
  # Whether to normalize nicknames to formal names
  normalize_nicknames: true
  
  # Whether to strip titles from person names
  strip_titles: true
  
  # Whether to strip corporate suffixes from org names
  strip_org_suffixes: true
  
  # Case-insensitive matching
  case_insensitive: true

