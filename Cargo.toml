[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "LicenseRef-Proprietary"
publish = false
rust-version = "1.99"

[workspace.dependencies]
# Internal crates
impeach-core = { path = "crates/impeach-core" }
impeach-config = { path = "crates/impeach-config" }
impeach-text = { path = "crates/impeach-text" }
impeach-ingest = { path = "crates/impeach-ingest" }
impeach-store = { path = "crates/impeach-store", default-features = false }
impeach-models = { path = "crates/impeach-models", default-features = false }
impeach-ner = { path = "crates/impeach-ner" }
impeach-coref = { path = "crates/impeach-coref" }
impeach-ed = { path = "crates/impeach-ed" }
impeach-facts = { path = "crates/impeach-facts" }
impeach-contradictions = { path = "crates/impeach-contradictions" }
impeach-pipeline = { path = "crates/impeach-pipeline", default-features = false }
impeach-eval = { path = "crates/impeach-eval", default-features = false }

# Serialization and errors
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
yaml_serde = "0.10.7"
thiserror = "2.0.21"
anyhow = "1.0.104"

# Text and utilities
regex = "1.13.1"
once_cell = "1.21.4"
strsim = "0.11.1"
include_dir = "0.7.4"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.28.0", features = ["v4", "serde"] }
indexmap = { version = "2.14.2", features = ["serde"] }

# Logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

# Storage
rusqlite = { version = "0.40.2", features = ["bundled"] }
helix-db = { git = "https://github.com/helixdb/helix-db", rev = "16b7a8374f7a97684472a3a1462aa8adaca55e79", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "sync", "time"] }
fs4 = { version = "1.1.0", default-features = false, features = ["sync"] }

# Models
fastembed = { version = "7.1.1", default-features = false }
ort = { version = "=2.0.0-rc.13", default-features = false }
tokenizers = { version = "0.23.2", default-features = false }
hf-hub = { version = "0.5.0", default-features = false }
gliner2 = { version = "0.1.3", default-features = false }
ollama-rs = { version = "0.3.6", default-features = false }

# Ingestion and chunking
csv = "1.4.0"
unicode-general-category = "1.1.0"
text-splitter = "0.33.0"
pdf-extract = "0.12.1"

# CLI and processes
clap = { version = "4.6.7", features = ["derive"] }
process-wrap = "10.0.1"

# Evaluation
pathfinding = "4.16.0"

# Testing
tempfile = "3.27.0"
pretty_assertions = "1.4.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cloned_instead_of_copied = "warn"
explicit_iter_loop = "warn"
implicit_clone = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
needless_pass_by_value = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
unwrap_used = "warn"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false
