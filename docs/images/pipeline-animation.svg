<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" role="img" aria-label="Impeach: documents are distilled into facts stored in a case-memory graph; new statements are compared against related facts by an NLI judge and flagged or committed.">
<title>Impeach pipeline</title>
<style>
:root,svg{--ink:#1f2328;--muted:#656d76;--surface:#f6f8fa;--line:#d0d7de;--accent:#0969da;--danger:#cf222e}
